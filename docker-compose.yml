version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apextime-in-postgres
    environment:
      POSTGRES_DB: apextime_in
      POSTGRES_USER: apextime
      POSTGRES_PASSWORD: apextime123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apextime-in-backend
    environment:
      DATABASE_URL: postgresql://apextime:apextime123@postgres:5432/apextime_in
      JWT_SECRET: ${JWT_SECRET:-apextime-cloud-jwt-secret-change-in-production}
      NODE_ENV: production
      PORT: 5003
      TZ: Asia/Kolkata
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "5003:5003"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apextime-in-frontend
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: apextime-in-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
