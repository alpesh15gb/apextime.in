version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apextime-in-postgres
    environment:
      POSTGRES_DB: apextime_in
      POSTGRES_USER: apextime
      POSTGRES_PASSWORD: apextime123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apextime-in-backend
    environment:
      DATABASE_URL: postgresql://apextime:apextime123@postgres:5432/apextime_in
      JWT_SECRET: ${JWT_SECRET:-apextime-cloud-jwt-secret-change-in-production}
      NODE_ENV: production
      PORT: 5003
      TZ: Asia/Kolkata
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "5003:5003"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apextime-in-frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: apextime-in-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
